  <style>
    @keyframes alr-spin  { to { transform: rotate(360deg); } }
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #f8f6ef;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; z-index: 9999;

    }
    #app-loading .alr-mark {
      width: 56px; height: 56px;
    }
    #app-loading .alr-name {
      font-size: 15px; font-weight: 600; letter-spacing: .08em;
      color: #06372a; text-transform: uppercase;
    }
    #app-loading .alr-tagline {
      font-size: 12px; color: #5f6f6a; letter-spacing: .02em;
    }
    #app-loading .alr-track {
      width: 180px; height: 3px; background: #e3e0d4; border-radius: 999px;
      overflow: hidden;
    }
    #app-loading .alr-bar {
      width: 40%; height: 100%;
      background: linear-gradient(90deg,#0b6e4f,#d4af37);
      border-radius: 999px;
      animation: alr-spin 1.4s ease-in-out infinite;
      transform-origin: left;
    }
    #app-loading .alr-spin {
      width: 32px; height: 32px; border: 2.5px solid #e3e0d4;
      border-top-color: #0b6e4f; border-radius: 50%;
      animation: alr-spin .75s linear infinite;
    }
  </style>
  <div id="root">
