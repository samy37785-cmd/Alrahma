<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Al-Rahma Academy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f3a" />
      <stop offset="1" stop-color="#0c3834" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Icon: the academy's current logo (public/brand/icon.png, 484x560),
       centered above the wordmark. It replaced the earlier hand-drawn mark.
       scripts/gen-og-image.mjs inlines the file when it rasterises this SVG. -->
  <image href="brand/icon.png" x="518" y="96" width="164" height="190" preserveAspectRatio="xMidYMid meet" />

  <!-- Wordmark: font-family references Cinzel/Cairo/Amiri (self-hosted by
       the app for in-app rendering). Viewers without those fonts installed
       fall back to serif/sans-serif — a known limitation for this static
       file, called out in the delivery report. All lines are centered on
       the canvas midpoint (x=600) so the RTL Arabic/Bismillah lines (which
       render leftward from their anchor) can't collide with the icon. -->
  <text x="600" y="352" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="58" letter-spacing="3" fill="#f6f1e6">AL-RAHMA</text>
  <line x1="490" y1="382" x2="710" y2="382" stroke="#d4af37" stroke-width="2" />
  <text x="600" y="417" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="26" letter-spacing="8" fill="#d4af37">ACADEMY</text>
  <text x="600" y="477" text-anchor="middle" font-family="Cairo, 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#f6f1e6" direction="rtl">أكاديمية الرحمة</text>
  <text x="600" y="527" text-anchor="middle" font-family="Amiri, Georgia, serif" font-size="30" fill="#d4af37" direction="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
</svg>
